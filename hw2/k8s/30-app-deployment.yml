---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trade-app
  namespace: trade
spec:
  replicas: 2
  selector:
    matchLabels:
      app: trade-app
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: trade-app
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      initContainers:
      - image: trade-migrate:0.1.0
        imagePullPolicy: IfNotPresent
        name: wait-for-migrations
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: DATABASE_URL
        command:
        - /bin/sh
        - -c
        - |
          latest=$(ls /migrations | grep '\.up\.sql$' | sort | tail -n 1 | cut -d _ -f 1 | sed 's/^0*//')
          until [ "$(migrate -path=/migrations -database="$DATABASE_URL" version 2>&1)" = "$latest" ]; do
            echo "waiting for migration $latest"
            sleep 2
          done
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
      containers:
      - image: trade-app:0.1.0
        imagePullPolicy: IfNotPresent
        name: trade-app
        envFrom:
        - configMapRef:
            name: trade-app
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: DATABASE_URL
        ports:
        - containerPort: 8080
          name: http
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /readyz
            port: http
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 2
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 2
          initialDelaySeconds: 5
        lifecycle:
          preStop:
            exec:
              command:
              - sleep
              - "5"
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
...
