---
apiVersion: batch/v1
kind: Job
metadata:
  name: trade-migrate
  namespace: trade
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app: trade-migrate
    spec:
      initContainers:
      - image: postgres:17-alpine
        imagePullPolicy: IfNotPresent
        name: wait-for-postgres
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: DATABASE_URL
        command:
        - /bin/sh
        - -c
        - until pg_isready -d "$DATABASE_URL"; do sleep 2; done
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 32Mi
      containers:
      - image: trade-migrate:0.1.0
        imagePullPolicy: IfNotPresent
        name: migrate
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: DATABASE_URL
        args:
        - -database=$(DATABASE_URL)
        - up
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 64Mi
      restartPolicy: Never
...
